<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四字熟語あつめ｜また遊ぼ</title>
<meta name="description" content="漢字の部品をみんなで持ち寄って、四字熟語を完成させよう。速く、みんなで協力するほど点が高い。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* 四字熟語あつめ（2026-10-25 試作）。漢字の部品を手札として配り、机の上の4文字の枠にはめて四字熟語を完成させる
   机はボードと場をかねる：正しい枠に置けばはまる。枠の外に置いた部品・まちがった枠に置いた部品は机に転がり、誰でも拾える
   点は1文字ごと：速さ（その文字ができるまでの時間）と協力（何人で作ったか・ほかの人に配られた部品を使ったか） */
:root{--bg:#fff5ea;--dot:#fbe3cf;--card:#fffdf9;--line:#f1dcc6;--ink:#4a2f22;--muted:#8f6b58;--accent:#e8743b;--on:#ffe3cc;--desk:#f6e6cf;--desk2:#ecd5b6;
  --ui:"Zen Maru Gothic",sans-serif;--pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif}
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 18%,transparent 19%),radial-gradient(var(--dot) 18%,transparent 19%);background-size:34px 34px;background-position:0 0,17px 17px;
  color:var(--ink);font-family:var(--ui);font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px}
h1{flex:1;margin:0;font-family:var(--pop);font-weight:400;font-size:1.1rem;color:var(--accent)}
.pill{font:inherit;font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.go{font:inherit;font-family:var(--pop);font-size:1.25rem;border:0;border-radius:16px;background:var(--accent);color:#fff;padding:12px 30px;box-shadow:0 4px 0 #b9551f;cursor:pointer}
.go:active,.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
/* お題：読みと意味。答えの漢字は見せない */
.odai{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.odai div{flex:1;min-width:0}.odai b{display:block;font-family:var(--pop);font-weight:400;font-size:1.15rem;letter-spacing:.04em}.odai span{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.clock{font-family:var(--pop);font-size:1.1rem;color:var(--accent);font-variant-numeric:tabular-nums}
.mates{display:flex;gap:6px;flex-wrap:wrap}
.mate{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:.78rem;font-weight:700}
.mate i{width:18px;height:18px;border-radius:50%;background:var(--c)}.mate small{color:var(--muted)}
.mate.think{border-color:var(--c)}
/* 机：枠（4文字）と、転がっている部品 */
.desk{position:relative;flex:1 1 auto;min-height:250px;container-type:size;border-radius:18px;background:var(--desk);border:3px solid var(--desk2);box-shadow:inset 0 0 0 6px #f9edda;overflow:hidden}
.frames{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80cqw,100cqh - 150px);display:grid;grid-template-columns:1fr 1fr;gap:10px}   /* 2×2（左上→右上→左下→右下の順に読む）。上と下に部品が転がる場所を残す */
.frame{position:relative;aspect-ratio:1;background:#fffdf7;border:2px dashed #d9b98f;border-radius:10px}
.frame.done{border-style:solid;border-color:var(--accent);background:#fff;animation:pop .45s}
.frame.drop{border-color:var(--accent);background:var(--on)}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.frame .pts{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-shadow:0 2px 0 #fff;font-size:1.4rem;font-family:var(--pop);font-size:.95rem;color:var(--accent);white-space:nowrap;animation:rise 1.6s forwards;pointer-events:none}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes rise{to{transform:translate(-50%,-140%);opacity:0}}
/* 部品の札。中の線は、その部品が漢字の中にあるときの形をそのまま切り出したもの */
.tile{position:absolute;width:var(--s,58px);height:var(--s,58px);border-radius:12px;background:#fffdf9;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);touch-action:none;cursor:grab}
.tile svg{width:100%;height:100%;display:block}
.tile.moving{z-index:20;transition:left .55s cubic-bezier(.3,.7,.4,1),top .55s cubic-bezier(.3,.7,.4,1)}
.tile.drag{position:fixed;z-index:50;cursor:grabbing;box-shadow:0 8px 14px rgba(74,47,34,.25)}
/* だれが持っているか（2026-10-25）：つかんでいる・動かしている札は、その人の色で光って名前が付く。机に出した札の右上には、出した人の色の点 */
.tile.held{z-index:30;border-color:var(--pc);box-shadow:0 0 0 3px var(--pc),0 8px 14px rgba(74,47,34,.22)}
.tile .who{display:none;position:absolute;left:50%;top:-5px;transform:translate(-50%,-100%);padding:1px 8px;border-radius:999px;background:var(--pc);color:#fff;font-size:.7rem;font-weight:900;white-space:nowrap}
.tile.held .who{display:block}
.tile .dot{display:none;position:absolute;right:4px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--dc);border:2px solid #fff}
.tile.dot .dot{display:block}.tile.held .dot{display:none}
.hand{position:relative;flex:0 0 auto;min-height:84px;padding:10px;border-radius:18px;background:var(--card);border:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.hand .tile{position:relative}
.hand .lbl{position:absolute;left:12px;top:-10px;padding:0 8px;background:var(--card);font-size:.72rem;font-weight:900;color:var(--muted)}
.hand .empty{margin:auto;font-size:.8rem;color:var(--muted);font-weight:700}
.bar{display:flex;gap:6px;justify-content:flex-end}
/* 最初の画面・結果 */
.over{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 18px;overflow:auto;background:color-mix(in srgb,var(--bg) 96%,transparent);text-align:center}
.over>:first-child{margin-top:auto}.over>:last-child{margin-bottom:auto}
.over h2{margin:0;font-family:var(--pop);font-weight:400;font-size:1.7rem;color:var(--accent)}
.over p{margin:0;max-width:430px;line-height:1.6}
.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.choices .pill.on{background:var(--on);border-color:var(--accent)}
.res{width:100%;max-width:430px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;text-align:left}
.row .k{font-size:2rem;font-weight:900;width:1.2em;text-align:center}.row .d{flex:1;font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.5}.row .p{font-family:var(--pop);font-size:1.15rem;color:var(--accent)}
.row .who{display:inline-flex;gap:3px;vertical-align:-2px}.row .who i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.total{font-family:var(--pop);font-size:2rem;color:var(--ink)}
.ans{font-size:2.6rem;font-weight:900;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;font-size:.9rem;pointer-events:none}
.credit{font-size:.7rem;color:var(--muted)}.credit a{color:inherit}
</style>
</head>
<body>
<div class="app">
  <header><h1>四字熟語あつめ</h1><button class="pill" id="hintBtn" type="button" hidden>ヒント</button><button class="pill" id="quitBtn" type="button" hidden>やめる</button></header>
  <div class="odai"><div><b id="yomi">　</b><span id="imi">　</span></div><span class="clock" id="clock">0</span></div>
  <div class="mates" id="mates"></div>
  <div class="desk" id="desk"><div class="frames" id="frames"></div></div>
  <div class="hand" id="hand"><span class="lbl">あなたの手札</span></div>
</div>

<div class="over" id="start">
  <h2>四字熟語あつめ</h2>
  <p>漢字の<b>部品</b>がみんなに配られます。読みと意味をヒントに、机の4つの枠に部品をはめて、<b>四字熟語</b>を完成させよう。</p>
  <p>どこに使うか分からない部品は、机に置いておけば、だれでも拾えます。<br>速く、みんなで協力するほど点が高い（1文字ごとに点がつきます）。</p>
  <div><b>いっしょに遊ぶ CPU</b><div class="choices" id="cpuN" style="margin-top:6px"></div></div>
  <button class="go" id="startBtn" type="button">はじめる</button>
  <p class="credit">漢字の形：<a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0）</p>
</div>
<div class="over" id="result" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
'use strict';
// 画面は、いまの様子 V を描くだけ。V を作って動かすのは ENG（ひとりで遊ぶ：この下の SOLO、みんなで遊ぶ：online.js）
//   V：{q, chars:[{ch, slots:[{by}], at, pts}], hinted:[], players:[{n,c,cpu,think}], me（自分の番号。観戦なら -1）, tiles:[札], t0, over}
//   札：{id, src:[字の番号,部品の番号], where:'hand'|'desk'|'air'|'placed', holder, held, dropBy, u, band, v,
//        from（運び始め：'hand' か {u,band,v}）, to（行き先：{i} か {u,band,v}）, go（動き出したか）, dx, dy（だれかが指で動かしている場所。机に対する 0〜1）}
//   ENG：{grab(id), drop(id, 行き先), hint(), quit()}。行き先は {i}（枠）・{u,band,v}（机）・{hand:true}
const $=id=>document.getElementById(id);
const D=window.YOJI,C=window.YojiCore;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLS=['#e8743b','#43b2f5','#6cc94e','#b45cc8','#ff6f9f','#e0a21c'],CPU_NAMES=['ハル','ミオ','ソウ','ナギ','ユイ'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let V=null,ENG=null;

// ---------- 部品の形 ----------
// 部品の線を、漢字の中にあるときの大きさのまま描く。札には、線のまわりだけを切り出して見せる（getBBox で線の範囲を測る）
const meas=document.createElementNS('http://www.w3.org/2000/svg','svg');meas.setAttribute('style','position:absolute;left:-9999px;width:109px;height:109px');document.body.append(meas);
const boxCache=new Map();
function boxOf(d){const k=d.join('|');if(boxCache.has(k))return boxCache.get(k);
  meas.innerHTML=`<g>${d.map(x=>`<path d="${x}"/>`).join('')}</g>`;const b=meas.firstChild.getBBox();const pad=7;
  const s=Math.max(b.width,b.height)+pad*2,cx=b.x+b.width/2,cy=b.y+b.height/2;const r=[cx-s/2,cy-s/2,s,s];boxCache.set(k,r);return r}
const strokes=(d,col='#3b2a20',w=4.2)=>`<g fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d.map(x=>`<path d="${x}"/>`).join('')}</g>`;
const dOf=(q,src)=>D.K[[...q.w][src[0]]][src[1]].d;   // 札の線：配られたときの字の、その部品
const slotD=(ch,j)=>D.K[ch][j].d;

// ---------- 机の上の場所 ----------
// 机は枠の上と下に、部品が転がる帯がある。札の場所 {u,band,v} を、この画面の机の中の px にする
const S=58;
function bandBox(band){const d=$('desk').getBoundingClientRect(),fr=$('frames').getBoundingClientRect();
  const top=band?fr.bottom-d.top+6:8,bot=band?d.height-S-8:fr.top-d.top-S-6;return {x0:8,x1:Math.max(8,d.width-S-8),y0:top,y1:Math.max(top,bot)}}
function px(p){const b=bandBox(p.band);return {x:b.x0+p.u*(b.x1-b.x0),y:b.y0+p.v*(b.y1-b.y0)}}
function fromPx(x,y){const d=$('desk').getBoundingClientRect(),fr=$('frames').getBoundingClientRect(),band=y+S/2>fr.top-d.top+fr.height/2?1:0,b=bandBox(band);
  const cl=a=>Math.max(0,Math.min(1,a));return {u:cl((x-b.x0)/Math.max(1,b.x1-b.x0)),band,v:cl((y-b.y0)/Math.max(1,b.y1-b.y0))}}
function framePx(i){const d=$('desk').getBoundingClientRect(),f=$('frames').children[i].getBoundingClientRect();return {x:f.left-d.left+f.width/2-S/2,y:f.top-d.top+f.height/2-S/2}}
function matePx(p){const d=$('desk').getBoundingClientRect(),m=document.querySelector(`.mate[data-p="${p}"]`),r=m?m.getBoundingClientRect():d;return {x:Math.max(6,Math.min(d.width-S-6,r.left-d.left+10)),y:22}}
function frameAt(cx,cy){for(const f of $('frames').children){const r=f.getBoundingClientRect();if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom)return +f.dataset.i}return -1}

// ---------- 描く ----------
let shownQ=null;
function tileEl(t){const e=document.createElement('div');e.className='tile';e.dataset.id=t.id;e.innerHTML=`<svg viewBox="${boxOf(dOf(V.q,t.src)).join(' ')}">${strokes(dOf(V.q,t.src))}</svg><b class="who"></b><i class="dot"></i>`;e.addEventListener('pointerdown',grab);return e}
// 札に「だれがつかんでいるか」「だれが机に出したか」を付ける
function markTile(e,t){const p=t.held!=null?V.players[t.held]:null;e.classList.toggle('held',!!p);
  if(p){e.style.setProperty('--pc',p.c);e.querySelector('.who').textContent=p.n}
  const dp=t.where==='desk'&&t.dropBy!=null?V.players[t.dropBy]:null;e.classList.toggle('dot',!!dp);if(dp)e.style.setProperty('--dc',dp.c)}
function render(){
  if(!V)return;
  if(shownQ!==V){/* 新しい問題：枠を作り直す */}
  const key=V.q.w+':'+(V.game||0);
  if(shownQ!==key){shownQ=key;$('yomi').textContent=V.q.y;$('imi').textContent=V.q.m;
    $('frames').innerHTML=V.chars.map((c,i)=>`<div class="frame" data-i="${i}"><svg viewBox="0 0 109 109"></svg></div>`).join('');
    [...document.querySelectorAll('.tile')].forEach(e=>{if(!e.classList.contains('drag'))e.remove()});seenDone.clear()}
  // 仲間（手札の数）
  $('mates').innerHTML=V.players.map((p,i)=>`<span class="mate${p.think?' think':''}${i===V.me?' me':''}" style="--c:${p.c}" data-p="${i}"><i></i>${esc(p.n)}<small>${V.tiles.filter(t=>t.where==='hand'&&t.holder===i).length}枚</small></span>`).join('');
  // 枠：はまった部品は、はめた人の色で描く。ヒントで見せた字は薄く。できた字は点が浮かぶ
  V.chars.forEach((c,i)=>{const f=$('frames').children[i],sv=f.querySelector('svg');
    sv.innerHTML=(V.hinted.includes(i)?strokes(c.slots.flatMap((s,j)=>slotD(c.ch,j)),'#e8d6bf',3.6):'')+c.slots.map((s,j)=>s.by!=null?strokes(slotD(c.ch,j),c.at!=null?'#3b2a20':V.players[s.by].c):'').join('');
    f.classList.toggle('done',c.at!=null);
    if(c.at!=null&&c.pts&&!seenDone.has(i)){seenDone.add(i);f.insertAdjacentHTML('beforeend',`<span class="pts">+${c.pts.sum}</span>`)}});
  // 手札
  const hand=$('hand'),mine=V.tiles.filter(t=>t.where==='hand'&&t.holder===V.me&&!(drag&&drag.id===t.id));
  [...hand.querySelectorAll('.tile,.empty')].forEach(e=>{if(!e.classList.contains('tile')||!mine.some(t=>t.id===e.dataset.id))e.remove()});
  for(const t of mine)if(!hand.querySelector(`.tile[data-id="${t.id}"]`))hand.append(tileEl(t));
  if(!mine.length)hand.insertAdjacentHTML('beforeend',`<span class="empty">${V.me<0?'観戦中':'手札はもうありません。机の部品も拾えます'}</span>`);
  hand.hidden=V.me<0&&!V.watchHand;
  // 机の上：転がっている札と、だれかが運んでいる札
  const desk=$('desk');
  for(const t of V.tiles){let e=desk.querySelector(`.tile[data-id="${t.id}"]`);
    const show=(t.where==='desk'||t.where==='air')&&!(drag&&drag.id===t.id);
    if(!show){if(e)e.remove();continue}
    if(!e){e=tileEl(t);desk.append(e)}
    let p;
    if(t.where==='desk')p=px(t);
    else if(t.dx!=null){const d=desk.getBoundingClientRect();p={x:t.dx*d.width-S/2,y:t.dy*d.height-S/2}}   // だれかが指で動かしている
    else if(t.go)p=t.to&&t.to.i!=null?framePx(t.to.i):px(t.to);
    else p=t.from==='hand'?matePx(t.held):px(t.from);
    e.classList.toggle('moving',t.where==='air'&&!!t.go||t.dx!=null);
    e.style.left=p.x+'px';e.style.top=p.y+'px';markTile(e,t)}
}
const seenDone=new Set();
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>t.hidden=true,1600)}

// ---------- つまんで動かす（自分） ----------
let drag=null;
function grab(e){
  if(!V||V.over||V.me<0||!ENG)return;const el=e.currentTarget,t=V.tiles.find(x=>x.id===el.dataset.id);
  if(!t||!(t.where==='hand'&&t.holder===V.me||t.where==='desk'&&t.held==null))return;
  if(ENG.grab(t.id)===false)return;
  e.preventDefault();const r=el.getBoundingClientRect();
  drag={id:t.id,el,dx:e.clientX-r.left,dy:e.clientY-r.top};
  el.classList.add('drag','held');el.style.setProperty('--pc',V.players[V.me].c);el.querySelector('.who').textContent=V.players[V.me].n;
  document.body.append(el);move(e);
  el.setPointerCapture?.(e.pointerId);
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',drop);el.addEventListener('pointercancel',drop);
}
function move(e){if(!drag)return;drag.el.style.left=(e.clientX-drag.dx)+'px';drag.el.style.top=(e.clientY-drag.dy)+'px';
  const i=frameAt(e.clientX,e.clientY);[...$('frames').children].forEach((f,k)=>f.classList.toggle('drop',k===i));
  if(ENG.moving){const d=$('desk').getBoundingClientRect();ENG.moving(drag.id,(e.clientX-drag.dx+S/2-d.left)/d.width,(e.clientY-drag.dy+S/2-d.top)/d.height)}}
function drop(e){
  if(!drag)return;const {id,el}=drag;drag=null;
  el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',drop);el.removeEventListener('pointercancel',drop);
  [...$('frames').children].forEach(f=>f.classList.remove('drop'));
  const i=frameAt(e.clientX,e.clientY),d=$('desk').getBoundingClientRect(),r=el.getBoundingClientRect();
  el.remove();
  if(i>=0){ENG.drop(id,{i});return}
  if(e.clientX>=d.left&&e.clientX<=d.right&&e.clientY>=d.top&&e.clientY<=d.bottom){ENG.drop(id,fromPx(r.left-d.left,r.top-d.top));return}
  ENG.drop(id,{hand:true});   // 机の外：手札へ（机から拾ったものも、自分の手札へ）
}

// ---------- ひとりで遊ぶ（CPU の仲間と） ----------
const SOLO=(()=>{
  let g=null,cpuN=store.get('yj-cpu',2),qi=store.get('yj-q',3);   // はじめては温故知新から（部品が分かれる字が多い。一石二鳥は全部まるごとの字で、協力が生まれにくい）
  const now=()=>performance.now(),sec=()=>(now()-V.t0)/1000;
  function start(){
    const q=D.list[qi%D.list.length];qi++;store.set('yj-q',qi);
    const players=[{n:'あなた',c:COLS[0],cpu:false},...CPU_NAMES.slice(0,cpuN).map((n,i)=>({n,c:COLS[i+1],cpu:true,next:0}))];
    g=C.deal(q,D.K,players.length);
    V={...g,players,me:0,t0:now(),over:false,game:(V&&V.game||0)+1};
    players.forEach((p,i)=>{if(p.cpu)p.next=V.t0+1800+Math.random()*1500+i*500});
    $('start').hidden=true;$('result').hidden=true;$('hintBtn').hidden=false;$('quitBtn').hidden=false;
    render();
  }
  const T=id=>V.tiles.find(t=>t.id===id);
  function landDesk(t,spot,by){Object.assign(t,{where:'desk',holder:null,held:null,dropBy:by,dx:null,dy:null,go:false},spot)}
  function put(t,i,by){
    const r=C.place(V,t,i,by,sec());
    if(!r){landDesk(t,C.freeSpot(V,(i%2)*0.6+0.2),by);if(by===0)toast('ここではないみたい…');render();return}
    render();if(r.all)finish(false);
  }
  const eng={
    grab(id){const t=T(id);if(!t)return false;t.held=0;return true},
    drop(id,to){const t=T(id);if(!t)return;t.held=null;
      if(to.i!=null)put(t,to.i,0);
      else if(to.hand){Object.assign(t,{where:'hand',holder:0,dropBy:null})}
      else landDesk(t,to,0);
      render()},
    hint(){if(C.hint(V)<0)toast('ヒントはもうありません');else toast('1文字を薄く見せました（その文字は −20点）');render()},
    quit(){finish(true)},
  };
  // CPU の仲間：それぞれ1.5〜4秒ごとに考える。つかんだところを見せてから（0.45秒）運ぶ（0.6秒）
  function tick(){
    if(!V||V.over||ENG!==eng)return;
    V.players.forEach((p,pi)=>{
      if(!p.cpu||now()<p.next||p.busy)return;
      p.next=now()+1500+Math.random()*2500;
      const c=C.cpuChoose(V,pi,sec());if(!c)return;const t=c.t,q=V;
      t.from=t.where==='desk'?{u:t.u,band:t.band,v:t.v}:'hand';t.to=c.i>=0?{i:c.i}:C.freeSpot(V);
      t.where='air';t.held=pi;t.go=false;p.busy=p.think=true;render();
      setTimeout(()=>{if(V!==q)return;t.go=true;render()},450);
      setTimeout(()=>{if(V!==q)return;p.busy=p.think=false;t.held=null;t.go=false;
        if(c.i>=0){t.holder=pi;put(t,c.i,pi)}else{landDesk(t,t.to,pi);render()}},1050);
    });
  }
  function finish(gaveUp){if(V.over)return;V.over=true;V.gaveUp=gaveUp;setTimeout(()=>showResult(gaveUp,{next:start,back:()=>{$('result').hidden=true;$('start').hidden=false}}),gaveUp?0:900)}
  function renderStart(){$('cpuN').innerHTML=[0,1,2,3].map(n=>`<button class="pill${n===cpuN?' on':''}" data-n="${n}" type="button">${n?n+'人':'ひとり'}</button>`).join('');
    $('cpuN').querySelectorAll('button').forEach(b=>b.onclick=()=>{cpuN=+b.dataset.n;store.set('yj-cpu',cpuN);renderStart()})}
  return {eng,start,tick,renderStart};
})();

// ---------- 時計・ヒント・結果 ----------
function loop(){
  if(V&&!V.over){$('clock').textContent=Math.floor((performance.now()-V.t0)/1000)+'秒';SOLO.tick()}
  requestAnimationFrame(loop)}
$('hintBtn').onclick=()=>{if(V&&!V.over&&ENG)ENG.hint()};
$('quitBtn').onclick=()=>{if(V&&!V.over&&ENG)ENG.quit()};
// 結果：1文字ごとの点と、だれが作ったか。btn：{next, back}（みんなで遊ぶときは online.js が別のボタンを出す）
function showResult(gaveUp,btn){
  const total=C.total(V,!gaveUp),sec=V.chars.reduce((a,c)=>Math.max(a,c.at||0),0);
  const rows=V.chars.map(c=>`<div class="row"><span class="k">${c.ch}</span><span class="d">${c.pts?`${c.at.toFixed(1)}秒・速さ ${c.pts.speed}　協力 ${c.pts.coop}${c.pts.hint?`　ヒント ${c.pts.hint}`:''}<br><span class="who">${c.pts.who.map(w=>`<i style="--c:${V.players[w].c}"></i>`).join('')}</span> ${c.pts.who.length}人で作った`:'できなかった'}</span><span class="p">${c.pts?c.pts.sum:0}</span></div>`).join('');
  const best=store.get('yj-best',0);if(!gaveUp&&total>best&&btn&&btn.next)store.set('yj-best',total);
  $('result').innerHTML=`<h2>${gaveUp?'またこんど！':'完成！'}</h2><div class="ans">${V.q.w}</div><p><b>${V.q.y}</b><br>${V.q.m}</p>
    <div class="res">${rows}${gaveUp?'':`<div class="row"><span class="d">四字熟語ができたボーナス</span><span class="p">${C.BONUS}</span></div>`}</div>
    <div class="total">${total}点</div><p class="credit">${gaveUp?'':`${sec.toFixed(1)}秒で完成。`}${btn&&btn.next?`これまでの最高 ${Math.max(best,gaveUp?best:total)}点`:''}</p>
    <div id="resBtns">${btn&&btn.next?`<button class="go" id="nextBtn" type="button">つぎの四字熟語</button><br><button class="pill" id="backBtn" type="button" style="margin-top:10px">はじめの画面へ</button>`:''}</div>`;
  $('result').hidden=false;$('hintBtn').hidden=true;$('quitBtn').hidden=true;
  if(btn&&btn.next){$('nextBtn').onclick=btn.next;$('backBtn').onclick=btn.back}
}
$('startBtn').onclick=()=>{ENG=SOLO.eng;SOLO.start()};
SOLO.renderStart();requestAnimationFrame(loop);
addEventListener('resize',render);
</script>
